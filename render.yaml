services:
  - type: web
    name: viberoom
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run check && npm run build && npm test
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
