services:
  - type: web
    name: viberoom-v2
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run check && npm run build && npm test
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
      - key: ENABLE_CREDIT_ENFORCEMENT
        value: "false"
